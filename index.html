<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14040a">
<title>ROULETTE SEX POSITION</title>
<style>
:root{
  --negro:#14040a; --burdeos:#4a0a1c; --rojo:#8f1233; --oro:#d4af6a; --oro-claro:#f1d9a0; --marfil:#f6ead8;
  --serif:"Didot","Bodoni MT","Playfair Display","Hoefler Text",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:var(--serif);color:var(--marfil);
  background:radial-gradient(120% 80% at 50% 0%,var(--burdeos) 0%,var(--negro) 70%) fixed;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.pantalla{min-height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vh,26px);padding:18px 20px 28px;text-align:center}
.pantalla.activa{display:flex}
h1{font-weight:400;font-style:italic;font-size:clamp(2rem,9vw,3.6rem);line-height:1;letter-spacing:.02em;color:var(--oro-claro);text-shadow:0 0 28px rgba(212,175,106,.35)}
h1 span{display:block;font-style:normal;font-size:.5em;letter-spacing:.42em;color:var(--oro);margin-top:.35em}
.frase{font-size:clamp(1rem,4vw,1.2rem);font-style:italic;color:#d9c3b0;max-width:30ch}

/* Marco central */
.marco{
  width:min(78vw,52vh,360px);aspect-ratio:1;border-radius:50%;padding:7px;
  background:conic-gradient(from 210deg,var(--oro),#7a5a24,var(--oro-claro),#7a5a24,var(--oro));
  box-shadow:0 0 0 1px #000,0 18px 50px rgba(0,0,0,.65),0 0 60px rgba(143,18,51,.45);
}
.marco .disco{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#e8458f;position:relative}
.marco img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.marco.girando{animation:vibra .12s linear infinite}
@keyframes vibra{0%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}100%{transform:translateX(-1.5px)}}
.rotulo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(1.3rem,6vw,2rem);letter-spacing:.3em;color:var(--oro-claro);background:rgba(20,4,10,.55)}

/* Botones */
.btn{
  font-family:var(--serif);font-size:clamp(1.2rem,5vw,1.5rem);letter-spacing:.22em;text-indent:.22em;
  min-height:60px;width:min(88vw,340px);border:1px solid var(--oro);border-radius:999px;cursor:pointer;
  color:var(--negro);background:linear-gradient(180deg,var(--oro-claro),var(--oro) 55%,#a67f38);
  box-shadow:0 8px 28px rgba(143,18,51,.55),inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .12s,filter .2s,opacity .2s;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;filter:grayscale(.6);cursor:not-allowed}
.btn:focus-visible,.enlace:focus-visible{outline:3px solid var(--oro-claro);outline-offset:3px}
.enlace{background:none;border:0;font-family:var(--serif);font-size:.85rem;font-style:italic;color:#9b8378;text-decoration:underline;cursor:pointer;padding:12px}
.contador{font-size:.9rem;color:#9b8378;font-style:italic;min-height:1.2em}

/* Resultado */
.resultado-titulo{font-size:clamp(1.5rem,6.5vw,2.4rem);font-style:italic;color:var(--oro-claro);letter-spacing:.03em}
.resultado-marco{
  width:min(88vw,58vh,460px);aspect-ratio:1;border-radius:50%;padding:8px;
  background:conic-gradient(from 210deg,var(--oro),#7a5a24,var(--oro-claro),#7a5a24,var(--oro));
  box-shadow:0 0 0 1px #000,0 24px 70px rgba(0,0,0,.7),0 0 90px rgba(143,18,51,.6);
}
.resultado-marco .disco{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#e8458f}
.resultado-marco img{width:100%;height:100%;object-fit:contain;display:block}
#pRes.activa .resultado-marco{animation:zoom 1.1s cubic-bezier(.2,.9,.25,1.15) both}
#pRes.activa .resultado-titulo{animation:aparece .8s .5s both}
#pRes.activa .btn{animation:aparece .8s .8s both}
@keyframes zoom{0%{transform:scale(.25);opacity:.2}60%{opacity:1}100%{transform:scale(1)}}
@keyframes aparece{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Confirmación */
.velo{position:fixed;inset:0;background:rgba(10,2,5,.82);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
.velo.activa{display:flex}
.caja{background:var(--negro);border:1px solid var(--oro);border-radius:18px;padding:26px 22px;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:16px}
.caja p{font-size:1.1rem}
.caja .fila{display:flex;gap:10px}
.caja .btn{min-height:50px;font-size:1rem;letter-spacing:.1em;text-indent:.1em;width:auto;flex:1}
.btn.sec{background:transparent;color:var(--oro-claro);box-shadow:none}
#error{color:#ffb3c4;font-size:.95rem;max-width:32ch}
@media (prefers-reduced-motion:reduce){.marco.girando{animation:none}#pRes.activa *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>

<main id="pJuego" class="pantalla activa" aria-live="polite">
  <h1>ROULETTE<span>SEX POSITION</span></h1>
  <p class="frase">Dejad que el azar decida vuestra próxima aventura…</p>
  <div class="marco" id="marco"><div class="disco"><img id="imgCentral" alt="Postura" hidden><div class="rotulo" id="rotulo">SEX-POSITION</div></div></div>
  <button class="btn" id="btnGirar" disabled>CARGANDO…</button>
  <p id="error" hidden></p>
  <p class="contador" id="contador"></p>
  <button class="enlace" id="btnReiniciar">Reiniciar partida</button>
</main>

<section id="pRes" class="pantalla" aria-live="polite">
  <p class="resultado-titulo">¡ESTA ES VUESTRA POSTURA!</p>
  <div class="resultado-marco"><div class="disco"><img id="imgResultado" alt="Postura elegida"></div></div>
  <button class="btn" id="btnVolver">VOLVER A LA PARTIDA</button>
</section>

<div class="velo" id="velo" role="dialog" aria-modal="true">
  <div class="caja">
    <p>¿Reiniciar la partida? Se perderá el progreso y volverá a salir la postura inicial.</p>
    <div class="fila">
      <button class="btn sec" id="btnNo">CANCELAR</button>
      <button class="btn" id="btnSi">REINICIAR</button>
    </div>
  </div>
</div>

<script>
/* ============ CONFIGURACIÓN (edita aquí) ============ */
const CARPETA = "imagenes/";
// Lista centralizada: añade, quita o cambia nombres de archivo y ya está.
const IMAGENES = [
  "postura_01.jpg","postura_02.jpg","postura_03.jpg","postura_04.jpg","postura_05.jpg",
  "postura_06.jpg","postura_07.jpg","postura_08.jpg","postura_09.jpg","postura_10.jpg",
  "postura_11.jpg","postura_12.jpg","postura_13.jpg","postura_14.jpg","postura_15.jpg",
  "postura_16.jpg","postura_17.jpg","postura_18.jpg","postura_19.jpg","postura_20.jpg"
];
const PRIMER_RESULTADO = "postura_08.jpg"; // siempre sale en la primera tirada de una partida nueva
const DURACION_MS = 4500;                  // duración de la animación (2000-3000 recomendado; 4000-6000 si la quieres más larga)
const VELOCIDAD_INICIAL_MS = 40;           // cambio de imagen al empezar
const VELOCIDAD_FINAL_MS = 70;            // cambio de imagen al terminar (frena un poco para dar expectación)
const PAUSA_ANTES_RESULTADO_MS = 450;      // pausa con la imagen ganadora antes del zoom
const CLAVE_GUARDADO = "rouletteSexPosition_v1";
/* ====================================================== */

const $ = id => document.getElementById(id);
const el = {
  juego:$("pJuego"), res:$("pRes"), marco:$("marco"), img:$("imgCentral"), rotulo:$("rotulo"),
  girar:$("btnGirar"), volver:$("btnVolver"), imgRes:$("imgResultado"), error:$("error"),
  contador:$("contador"), reiniciar:$("btnReiniciar"), velo:$("velo"), si:$("btnSi"), no:$("btnNo")
};

let disponibles = [];        // imágenes que se han cargado correctamente
const cache = {};            // nombre -> objeto Image precargado
let girando = false;

const ESTADO_INICIAL = { tiradas:0, resultado:null, pantalla:"juego" };
let estado = cargarEstado();

/* ---------- Persistencia ---------- */
function cargarEstado(){
  try{
    const e = JSON.parse(localStorage.getItem(CLAVE_GUARDADO));
    if(e && typeof e.tiradas==="number") return Object.assign({}, ESTADO_INICIAL, e);
  }catch(_){}
  return Object.assign({}, ESTADO_INICIAL);
}
function guardar(){ try{ localStorage.setItem(CLAVE_GUARDADO, JSON.stringify(estado)); }catch(_){} }

/* ---------- Precarga ---------- */
function precargar(nombre){
  return new Promise(ok=>{
    const im = new Image();
    im.onload = ()=>{ (im.decode ? im.decode().catch(()=>{}) : Promise.resolve()).then(()=>{ cache[nombre]=im; ok(true); }); };
    im.onerror = ()=>{ console.warn("No se pudo cargar:", CARPETA+nombre); ok(false); };
    im.src = CARPETA + nombre;
  });
}
async function iniciar(){
  const lista = [...new Set(IMAGENES)];
  const ok = await Promise.all(lista.map(precargar));
  disponibles = lista.filter((_,i)=>ok[i]);
  const fallos = lista.length - disponibles.length;
  if(!disponibles.length){
    el.girar.textContent = "SIN IMÁGENES";
    mostrarError("No se ha podido cargar ninguna imagen. Comprueba que la carpeta «imagenes/» está junto a index.html.");
    return;
  }
  if(fallos) mostrarError("Aviso: " + fallos + " imagen(es) no se han cargado y no saldrán en la ruleta.");
  // Recuperar partida
  if(estado.resultado && !disponibles.includes(estado.resultado)){ estado.resultado = null; estado.pantalla = "juego"; }
  if(estado.pantalla === "girando" && estado.resultado){ estado.pantalla = "resultado"; guardar(); } // se cerró durante la animación: mismo resultado, sin nueva tirada
  if(estado.pantalla === "resultado" && estado.resultado){ mostrarResultado(estado.resultado, false); }
  else { estado.pantalla = "juego"; mostrarJuego(); }
  el.girar.disabled = false; el.girar.textContent = "GIRAR";
}
function mostrarError(t){ el.error.textContent = t; el.error.hidden = false; }

/* ---------- Selección de resultado ---------- */
function elegirResultado(){
  if(estado.tiradas === 0 && disponibles.includes(PRIMER_RESULTADO)) return PRIMER_RESULTADO;
  return disponibles[Math.floor(Math.random()*disponibles.length)]; // equiprobable, repeticiones permitidas
}

/* ---------- Pantallas ---------- */
function mostrarJuego(){
  el.res.classList.remove("activa"); el.juego.classList.add("activa");
  el.contador.textContent = estado.tiradas ? "Tiradas: " + estado.tiradas : "";
  window.scrollTo(0,0);
}
function mostrarResultado(nombre){
  el.imgRes.src = cache[nombre].src;
  el.juego.classList.remove("activa");
  el.res.classList.remove("activa"); void el.res.offsetWidth; // reinicia la animación de zoom
  el.res.classList.add("activa");
  window.scrollTo(0,0);
}

/* ---------- La tirada ---------- */
function girar(){
  if(girando || !disponibles.length) return;
  girando = true; el.girar.disabled = true;
  // 1) Se decide y se guarda el resultado ANTES de animar
  const resultado = elegirResultado();
  estado.tiradas += 1; estado.resultado = resultado; estado.pantalla = "girando"; guardar();
  el.rotulo.hidden = true; el.img.hidden = false; el.marco.classList.add("girando");

  // 2) Animación sincronizada: el último fotograma es siempre el resultado
  const t0 = performance.now(); let ultimo = null, siguienteCambio = 0;
  function paso(ahora){
    const t = ahora - t0;
    if(t >= DURACION_MS){ return terminar(resultado); }
    if(t >= siguienteCambio){
      let n; do{ n = disponibles[Math.floor(Math.random()*disponibles.length)]; }while(n===ultimo && disponibles.length>1);
      ultimo = n; el.img.src = cache[n].src;
      const p = t / DURACION_MS;
      siguienteCambio = t + VELOCIDAD_INICIAL_MS + (VELOCIDAD_FINAL_MS - VELOCIDAD_INICIAL_MS) * p*p;
    }
    requestAnimationFrame(paso);
  }
  requestAnimationFrame(paso);
}
function terminar(resultado){
  el.img.src = cache[resultado].src; el.marco.classList.remove("girando");
  setTimeout(()=>{
    estado.pantalla = "resultado"; guardar();
    mostrarResultado(resultado);
    girando = false;
  }, PAUSA_ANTES_RESULTADO_MS);
}

/* ---------- Volver y reiniciar ---------- */
function volver(){
  estado.pantalla = "juego"; guardar();
  el.img.hidden = true; el.rotulo.hidden = false;
  mostrarJuego(); el.girar.disabled = false;
}
function reiniciar(){
  if(girando) return;
  estado = Object.assign({}, ESTADO_INICIAL); guardar();
  el.velo.classList.remove("activa");
  volver();
}

el.girar.addEventListener("click", girar);
el.volver.addEventListener("click", volver);
el.reiniciar.addEventListener("click", ()=>{ if(!girando){ el.velo.classList.add("activa"); el.no.focus(); } });
el.no.addEventListener("click", ()=>el.velo.classList.remove("activa"));
el.si.addEventListener("click", reiniciar);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") el.velo.classList.remove("activa"); });

iniciar();
</script>
</body>
</html>
